# Runs one ingest pass on the deployed app, by hand (Actions tab -> Ingest tick -> Run workflow).
# The regular polling is done by Vercel Cron every 5 minutes (vercel.json; needs the Pro plan).
# This used to run on a schedule, but GitHub delays or drops scheduled runs for hours, and a frame
# IMD has replaced cannot be fetched again. On the Hobby plan, where Vercel Cron runs only once a
# day, point an external cron service at the same URL instead.
# Repository secrets needed:  LANKAMET_URL  (e.g. https://lanka-met.vercel.app)   CRON_SECRET
name: Ingest tick

on:
  workflow_dispatch:

concurrency:
  group: ingest-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      LANKAMET_URL: ${{ secrets.LANKAMET_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call /api/ingest
        run: |
          if [ -z "$LANKAMET_URL" ]; then
            echo "::notice::Set the LANKAMET_URL repository secret (and CRON_SECRET) to use this."
            exit 0
          fi
          curl -fsS --max-time 120             -H "Authorization: Bearer $CRON_SECRET"             "$LANKAMET_URL/api/ingest?run=1"
